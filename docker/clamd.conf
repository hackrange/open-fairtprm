# ClamAV Daemon Configuration for Open TPRM Docker Container
# Unix socket only — no TCP listener needed in an all-in-one container.

LocalSocket /var/run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
User clamav

# Match FileUploadService's 10MB limit
MaxFileSize 10M
StreamMaxLength 10M

# Logging
LogSyslog no
LogFile /var/log/clamav/clamd.log
LogTime yes
LogVerbose no

# Performance — single-container, moderate traffic
MaxThreads 4
ReadTimeout 120
IdleTimeout 30
