; =============================================================================
; Open TPRM & GRC - PHP Hardening Configuration (Docker)
; =============================================================================

; --- Hide PHP from the world ---
expose_php = Off

; --- Error handling (never leak errors to users) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Disable dangerous functions ---
disable_functions = passthru,shell_exec,system,popen,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_waitpid,pcntl_wexitstatus,pcntl_setpriority,pcntl_getpriority,pcntl_async_signals,show_source,highlight_file,phpinfo,dl

; --- Filesystem restrictions ---
open_basedir = /var/www/html:/tmp:/var/lib/php/sessions:/var/log/php:/persistent:/etc/modsecurity:/var/run/clamav:/var/log/apache2

; --- Remote file inclusion prevention ---
allow_url_fopen = On
allow_url_include = Off

; --- Session hardening ---
session.name = __Host-APPSESSID
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_maxlifetime = 1800
session.cookie_lifetime = 0

; --- Upload limits ---
file_uploads = On
upload_max_filesize = 2G
post_max_size = 2G
max_file_uploads = 20

; --- Resource limits ---
max_execution_time = 300
max_input_time = 300
memory_limit = 2G
max_input_vars = 3000

; --- OPcache hardening ---
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.save_comments = 1
