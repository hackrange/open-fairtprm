<VirtualHost *:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	# Strip headers that reveal server software on all responses
	# (PHP strips these for dynamic pages; this catches static files and errors)
	Header always unset X-Powered-By
	Header always unset Server

	# HSTS: tell browsers to only contact this host over HTTPS for the next
	# year, including subdomains. TLS is terminated at the upstream proxy,
	# but the header rides through to the client and is what the browser
	# enforces. "always" makes Apache attach it to error responses too.
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

	# Trust X-Real-IP from the upstream reverse proxy so
	# REMOTE_ADDR reflects the real visitor IP, not the gateway.
	RemoteIPHeader X-Real-IP
	RemoteIPInternalProxy 10.0.0.0/8
	RemoteIPInternalProxy 172.16.0.0/12
	RemoteIPInternalProxy 192.168.0.0/16
	RemoteIPInternalProxy 127.0.0.0/8

	<Directory /var/www/html>
		Options -Indexes -MultiViews +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Block direct access to sensitive application directories
	<Directory /var/www/html/config>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/includes>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/sql_updates>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/db_backup>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/vendor>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/cron>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/init-db>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/migrations>
		AllowOverride None
		Require all denied
	</Directory>

	# Return 404 (not 403) for sensitive paths so responses are
	# indistinguishable from non-existent resources — denying with 403
	# confirms to a probing attacker that the file or directory exists.
	# RedirectMatch fires in the URL-translation phase, before the
	# <Directory> Require checks below, so the 404 wins in practice;
	# the Require all denied blocks remain as a defense-in-depth backstop.

	# Sensitive application directories
	RedirectMatch 404 "(?i)^/(config|includes|sql_updates|db_backup|vendor|cron|init-db|migrations)(/|$)"

	# Fingerprinting files (framework, dependency, version disclosure)
	RedirectMatch 404 "(?i)^/(composer\.(json|lock)|VERSION|package(-lock)?\.json|yarn\.lock|Gemfile(\.lock)?|setup)$"

	# Dotfiles (.htaccess, .htpasswd, .env, .git, etc.) anywhere in the tree
	RedirectMatch 404 "/\."

	# Theme demo pages and their bundled JS. The purchased theme ships a
	# tree of sample HTML (gallery, checkout, blog, etc.) plus a duplicate
	# minified bundle that embeds an old Bootstrap 4.1.3 (tooltip/popover
	# data-template XSS). The app only references images/ and bat/ under
	# this tree from PHP, never the demo HTML or js/, so block those two
	# subtrees while leaving the rest reachable.
	RedirectMatch 404 "(?i)^/app/template/site/[^/]+\.html$"
	RedirectMatch 404 "(?i)^/app/template/site/js(/|$)"

	DirectoryIndex index.php index.html

	# Branded error pages. Replaces Apache's default error documents (which
	# leak the server-info banner and don't match the app's look). Targets
	# are static HTML under /errors/ so they render even if PHP is down,
	# and they're served from inside DocumentRoot so no extra <Directory>
	# stanza is needed. Status code is preserved by Apache for ModSecurity
	# denies (e.g. login throttle 429) — only the response body is replaced.
	ErrorDocument 400 /errors/400.html
	ErrorDocument 403 /errors/403.html
	ErrorDocument 404 /errors/404.html
	ErrorDocument 429 /errors/429.html
	ErrorDocument 500 /errors/500.html
	ErrorDocument 502 /errors/500.html
	ErrorDocument 503 /errors/500.html

	# Logging
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
