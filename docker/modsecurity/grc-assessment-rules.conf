# =============================================================================
# FairTPRM - GRC Assessment & FairScore Endpoint Protection Rules
# Rule ID range: 501000-501099
# =============================================================================
# These rules provide endpoint-specific protections for the GRC Unified
# Assessment (FairScore) module. They complement the generic scanner-detection
# rules (400001-400052) with content-type validation, field-level sanitization,
# request body size exemptions for evidence uploads, and rate limiting.
#
# Protected endpoints:
#   /grc-assessment.php                    - Main assessment page (GET/POST)
#   /grc-fairscore.php                     - Dashboard page (GET only)
#   /grc-assessment-report.php             - Report editor page (GET only)
#   /grc-gaps.php                          - Gap analysis page (GET only)
#   /grc-tasks.php                         - Task inbox page (GET/POST)
#   /grc-risks.php                         - Risk register page (GET/POST)
#   /api/grc-unified-assessment.php        - AJAX API (POST only, JSON body)
#   /api/grc-assessment-evidence-upload.php - Evidence upload (POST, multipart/JSON)
#   /api/grc-assessment-report.php         - Report PDF generation (GET/POST)
#
# Last updated: 2026-03-08
# =============================================================================


# ── SECTION 1: HTTP Method Enforcement ──────────────────────────────────────
# Restrict each endpoint to only the HTTP methods it requires.
# The generic rule 400052 already blocks PATCH/TRACE/etc., but these rules
# enforce tighter per-endpoint method restrictions.

# Rule 501000: /grc-fairscore.php is read-only (GET/HEAD/OPTIONS only)
SecRule REQUEST_URI "@streq /grc-fairscore.php" \
    "id:501000,phase:1,deny,status:405,log,\
    msg:'GRC FairScore: only GET/HEAD/OPTIONS allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" ""

# Rule 501001: /api/grc-unified-assessment.php accepts POST only
SecRule REQUEST_URI "@streq /api/grc-unified-assessment.php" \
    "id:501001,phase:1,deny,status:405,log,\
    msg:'GRC Assessment API: only POST allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:POST|OPTIONS)$" ""

# Rule 501002: /api/grc-assessment-evidence-upload.php accepts POST only
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501002,phase:1,deny,status:405,log,\
    msg:'GRC Evidence Upload: only POST allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:POST|OPTIONS)$" ""


# ── SECTION 2: Content-Type Validation ──────────────────────────────────────
# Ensure API endpoints receive only expected content types. This prevents
# content-type confusion attacks and forces clients to declare their payload
# format correctly.

# Rule 501010: /api/grc-unified-assessment.php must send JSON
# Reject POST requests that do not declare application/json content type.
SecRule REQUEST_URI "@streq /api/grc-unified-assessment.php" \
    "id:501010,phase:1,deny,status:415,log,\
    msg:'GRC Assessment API: Content-Type must be application/json',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "@streq POST" "chain"
SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/json" ""

# Rule 501011: /api/grc-assessment-evidence-upload.php must send multipart or JSON
# Evidence uploads may use multipart/form-data (file upload) or application/json
# (metadata-only operations). Reject anything else.
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501011,phase:1,deny,status:415,log,\
    msg:'GRC Evidence Upload: Content-Type must be multipart/form-data or application/json',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "@streq POST" "chain"
SecRule REQUEST_HEADERS:Content-Type "!@rx ^(?:multipart/form-data|application/json)" ""


# ── SECTION 3: Request Body Size Exemptions ─────────────────────────────────
# The base modsecurity.conf enforces SecRequestBodyNoFilesLimit of 1MB.
# Evidence uploads can include files up to 50MB, so we raise the limit
# for that specific endpoint. The overall SecRequestBodyLimit (2GB) in
# modsecurity.conf already covers the raw body; this rule removes the
# no-files-limit enforcement that would otherwise reject large JSON
# metadata payloads alongside file uploads.

# Rule 501020: Exempt evidence upload from request body no-files limit
# CRS rule 920350 enforces SecRequestBodyNoFilesLimit; remove it for this path.
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501020,phase:1,pass,nolog,\
    ctl:ruleRemoveById=920350,\
    tag:'grc-assessment'"

# Rule 501021: Raise request body limit for evidence upload to 50MB (52428800 bytes)
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501021,phase:1,pass,nolog,\
    ctl:requestBodyLimit=52428800,\
    tag:'grc-assessment'"


# ── SECTION 4: Assessment Data Field Protections ────────────────────────────
# These rules inspect POST body content for suspicious patterns specific to
# assessment data fields. The generic SQLi/XSS rules (400010-400031) cover
# broad injection vectors; these rules target assessment-specific abuse
# patterns that exploit JSON field values.

# Rule 501030: Block LDAP injection in assessment JSON fields
# Assessment fields like assessor_name, control_status, notes could be targeted
# with LDAP filter injection if the app ever integrates with directory services.
SecRule REQUEST_URI "@rx ^/(?:api/grc-unified-assessment\.php|grc-assessment\.php)" \
    "id:501030,phase:2,deny,status:403,log,\
    msg:'GRC Assessment: LDAP injection pattern in request body',\
    tag:'grc-assessment',tag:'attack-ldap',\
    chain"
SecRule REQUEST_BODY "@rx (?i)(?:\(\||\(\&|\)\(|ldap://|%28%7c|%28%26)" \
    "t:none,t:urlDecodeUni,t:lowercase"

# Rule 501031: Block XML/XXE injection in assessment JSON payloads
# Assessment endpoints expect JSON, not XML. Presence of XML declarations,
# DOCTYPE, or ENTITY definitions indicates an XXE attack attempt.
SecRule REQUEST_URI "@rx ^/(?:api/grc-unified-assessment\.php|grc-assessment\.php)" \
    "id:501031,phase:2,deny,status:403,log,\
    msg:'GRC Assessment: XML/XXE injection in request body',\
    tag:'grc-assessment',tag:'attack-xxe',\
    chain"
SecRule REQUEST_BODY "@rx (?i)(?:<\?xml|<!DOCTYPE|<!ENTITY|SYSTEM\s+[\"'])" \
    "t:none,t:urlDecodeUni,t:lowercase"

# Rule 501032: Block Server-Side Request Forgery (SSRF) patterns in assessment fields
# Attackers may try to inject internal URLs in notes/evidence URL fields to trigger
# SSRF when the application processes them (e.g., fetching evidence from a URL).
SecRule REQUEST_URI "@rx ^/(?:api/grc-unified-assessment\.php|api/grc-assessment-evidence-upload\.php)" \
    "id:501032,phase:2,deny,status:403,log,\
    msg:'GRC Assessment: SSRF pattern in request body',\
    tag:'grc-assessment',tag:'attack-ssrf',\
    chain"
SecRule REQUEST_BODY "@rx (?i)(?:(?:file|gopher|dict|ftp|jar|netdoc)://|(?:http[s]?://(?:127\.|0\.|10\.|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|localhost|0x|metadata\.google)))" \
    "t:none,t:urlDecodeUni,t:lowercase"

# Rule 501033: Block expression language / template injection in assessment fields
# JSON string values in assessment payloads should never contain EL/SpEL/OGNL
# expressions. These indicate an attempt to exploit server-side template engines.
SecRule REQUEST_URI "@rx ^/(?:api/grc-unified-assessment\.php|grc-assessment\.php)" \
    "id:501033,phase:2,deny,status:403,log,\
    msg:'GRC Assessment: expression language injection in request body',\
    tag:'grc-assessment',tag:'attack-injection',\
    chain"
SecRule REQUEST_BODY "@rx (?:\$\{.*\}|#\{.*\}|%\{.*\}|T\(java\.)" \
    "t:none,t:urlDecodeUni"

# Rule 501034: Block excessively long field values in assessment JSON
# Individual JSON string values in assessment payloads should not exceed 10000
# characters. Longer values suggest buffer overflow attempts or data exfiltration
# payloads being smuggled in assessment fields.
SecRule REQUEST_URI "@streq /api/grc-unified-assessment.php" \
    "id:501034,phase:2,deny,status:413,log,\
    msg:'GRC Assessment API: excessively long field value detected',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_BODY "@rx \"[^\"]{10000,}\"" ""


# ── GRC Rate Limit IP Whitelist (auto-managed by LockdownService) ──
# Last updated: 2026-03-12
# Whitelisted IPs skip GRC assessment rate limiting and all ModSecurity deny rules.
SecRule REMOTE_ADDR "@ipMatch 136.226.122.91" \
    "id:501039,phase:1,pass,nolog,\
    ctl:ruleRemoveById=501040;501041;501042;501043;501044;501045;501078;501079;501080,\
    tag:'grc-assessment',tag:'ip-whitelist'"
# ── End GRC Rate Limit IP Whitelist ──


# ── SECTION 5: Rate Limiting ────────────────────────────────────────────────
# ModSecurity v2 does not natively support sliding-window rate limiting, but
# we can use the ip collection to track request counts per IP and enforce
# a ceiling. These rules limit assessment API calls to prevent abuse and
# automated scraping of assessment data.

# Rule 501040: Initialize IP tracking collection for assessment API
SecRule REQUEST_URI "@streq /api/grc-unified-assessment.php" \
    "id:501040,phase:1,pass,nolog,\
    initcol:ip=%{REMOTE_ADDR}_grc_assess,\
    tag:'grc-assessment'"

# Rule 501041: Increment request counter for assessment API calls
SecRule REQUEST_URI "@streq /api/grc-unified-assessment.php" \
    "id:501041,phase:1,pass,nolog,\
    setvar:ip.grc_assess_count=+1,\
    expirevar:ip.grc_assess_count=60,\
    tag:'grc-assessment'"

# Rule 501042: Block if more than 120 assessment API requests per minute from one IP
# Raised from 60 to 120 because autosave fires frequently when editing controls.
SecRule REQUEST_URI "@streq /api/grc-unified-assessment.php" \
    "id:501042,phase:1,deny,status:429,log,\
    msg:'GRC Assessment API: rate limit exceeded (>120 req/min from %{REMOTE_ADDR})',\
    tag:'grc-assessment',tag:'rate-limit',\
    chain"
SecRule IP:GRC_ASSESS_COUNT "@gt 120" ""

# Rule 501043: Initialize separate IP tracking for evidence uploads
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501043,phase:1,pass,nolog,\
    initcol:ip=%{REMOTE_ADDR}_grc_evidence,\
    tag:'grc-assessment'"

# Rule 501044: Increment evidence upload counter
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501044,phase:1,pass,nolog,\
    setvar:ip.grc_evidence_count=+1,\
    expirevar:ip.grc_evidence_count=60,\
    tag:'grc-assessment'"

# Rule 501045: Block if more than 30 evidence upload requests per minute
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501045,phase:1,deny,status:429,log,\
    msg:'GRC Evidence Upload: rate limit exceeded (>30 req/min from %{REMOTE_ADDR})',\
    tag:'grc-assessment',tag:'rate-limit',\
    chain"
SecRule IP:GRC_EVIDENCE_COUNT "@gt 30" ""


# ── SECTION 6: Evidence Upload Protections ──────────────────────────────────
# Additional protections for the evidence upload endpoint that handles
# file uploads containing compliance evidence (PDFs, screenshots, etc.).

# Rule 501050: Block dangerous file extensions in evidence uploads
# Only allow common document/image types. Block executables, scripts, and
# server-side code files that could lead to remote code execution if stored
# and later served by the web server.
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501050,phase:2,deny,status:403,log,\
    msg:'GRC Evidence Upload: dangerous file extension blocked',\
    tag:'grc-assessment',tag:'file-upload',\
    chain"
SecRule FILES_COMBINED_SIZE "@gt 0" "chain"
SecRule FILES "@rx (?i)\.(?:php[0-9]?|phtml|pht|phps|cgi|pl|py|rb|sh|bash|bat|cmd|com|exe|dll|msi|jsp|asp|aspx|war|jar|class|htaccess|htpasswd|svg)$" ""

# Rule 501051: Block uploads with null bytes in filenames
# Null byte injection in filenames can bypass extension checks (e.g., file.php%00.pdf).
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501051,phase:2,deny,status:403,log,\
    msg:'GRC Evidence Upload: null byte in filename',\
    tag:'grc-assessment',tag:'file-upload',\
    chain"
SecRule FILES "@rx %00|\\x00" ""

# Rule 501052: Block uploads with double extensions that hide executable types
# Filenames like "report.php.pdf" or "evidence.phtml.docx" may exploit misconfigured
# handlers that execute based on non-final extensions.
SecRule REQUEST_URI "@streq /api/grc-assessment-evidence-upload.php" \
    "id:501052,phase:2,deny,status:403,log,\
    msg:'GRC Evidence Upload: suspicious double extension',\
    tag:'grc-assessment',tag:'file-upload',\
    chain"
SecRule FILES "@rx (?i)\.(?:php[0-9]?|phtml|pht|cgi|pl|py|rb|sh|jsp|asp|aspx)\." ""


# ── SECTION 7: Report Editor & PDF Generation ──────────────────────────────

# Rule 501060: Report editor page - GET only
SecRule REQUEST_URI "@streq /grc-assessment-report.php" \
    "id:501060,phase:1,deny,status:405,log,\
    msg:'GRC Report Editor: only GET/HEAD/OPTIONS allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" ""

# Rule 501061: Report API - only GET and POST
SecRule REQUEST_URI "@streq /api/grc-assessment-report.php" \
    "id:501061,phase:1,deny,status:405,log,\
    msg:'GRC Report API: only GET/POST allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:GET|POST|HEAD|OPTIONS)$" ""

# Rule 501062: Report API POST - must be JSON
SecRule REQUEST_URI "@streq /api/grc-assessment-report.php" \
    "id:501062,phase:1,deny,status:415,log,\
    msg:'GRC Report API: POST must be application/json',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "@streq POST" \
    "chain"
SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/json" ""


# ── SECTION 8: Gap Analysis, Task Inbox & Risk Register ────────────────────
# WAF rules for pages added in v2.5.8.

# Rule 501070: /grc-gaps.php is read-only (GET/HEAD/OPTIONS only)
SecRule REQUEST_URI "@streq /grc-gaps.php" \
    "id:501070,phase:1,deny,status:405,log,\
    msg:'GRC Gaps: only GET/HEAD/OPTIONS allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" ""

# Rule 501071: /grc-tasks.php accepts GET and POST (reassign, status update)
SecRule REQUEST_URI "@streq /grc-tasks.php" \
    "id:501071,phase:1,deny,status:405,log,\
    msg:'GRC Tasks: only GET/POST allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:GET|POST|HEAD|OPTIONS)$" ""

# Rule 501072: /grc-risks.php accepts GET and POST (create, edit, delete)
SecRule REQUEST_URI "@streq /grc-risks.php" \
    "id:501072,phase:1,deny,status:405,log,\
    msg:'GRC Risks: only GET/POST allowed',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "!@rx ^(?:GET|POST|HEAD|OPTIONS)$" ""

# Rule 501073: /grc-tasks.php POST must be form-urlencoded (standard form submit)
SecRule REQUEST_URI "@streq /grc-tasks.php" \
    "id:501073,phase:1,deny,status:415,log,\
    msg:'GRC Tasks: POST must be application/x-www-form-urlencoded',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "@streq POST" "chain"
SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/x-www-form-urlencoded" ""

# Rule 501074: /grc-risks.php POST must be form-urlencoded (standard form submit)
SecRule REQUEST_URI "@streq /grc-risks.php" \
    "id:501074,phase:1,deny,status:415,log,\
    msg:'GRC Risks: POST must be application/x-www-form-urlencoded',\
    tag:'grc-assessment',\
    chain"
SecRule REQUEST_METHOD "@streq POST" "chain"
SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/x-www-form-urlencoded" ""

# Rule 501075: Block LDAP injection on GRC tasks/risks/gaps endpoints
SecRule REQUEST_URI "@rx ^/grc-(?:tasks|risks|gaps)\.php" \
    "id:501075,phase:2,deny,status:403,log,\
    msg:'GRC: LDAP injection pattern in request body',\
    tag:'grc-assessment',tag:'attack-ldap',\
    chain"
SecRule REQUEST_BODY "@rx (?i)(?:\(\||\(\&|\)\(|ldap://|%28%7c|%28%26)" \
    "t:none,t:urlDecodeUni,t:lowercase"

# Rule 501076: Block XXE injection on GRC tasks/risks/gaps endpoints
SecRule REQUEST_URI "@rx ^/grc-(?:tasks|risks|gaps)\.php" \
    "id:501076,phase:2,deny,status:403,log,\
    msg:'GRC: XML/XXE injection in request body',\
    tag:'grc-assessment',tag:'attack-xxe',\
    chain"
SecRule REQUEST_BODY "@rx (?i)(?:<\?xml|<!DOCTYPE|<!ENTITY|SYSTEM\s+[\"'])" \
    "t:none,t:urlDecodeUni,t:lowercase"

# Rule 501077: Block expression language injection on GRC tasks/risks/gaps
SecRule REQUEST_URI "@rx ^/grc-(?:tasks|risks|gaps)\.php" \
    "id:501077,phase:2,deny,status:403,log,\
    msg:'GRC: expression language injection in request body',\
    tag:'grc-assessment',tag:'attack-injection',\
    chain"
SecRule REQUEST_BODY "@rx (?:\$\{.*\}|#\{.*\}|%\{.*\}|T\(java\.)" \
    "t:none,t:urlDecodeUni"

# Rule 501078: Rate limit GRC page POST requests (tasks/risks)
SecRule REQUEST_URI "@rx ^/grc-(?:tasks|risks)\.php" \
    "id:501078,phase:1,pass,nolog,\
    initcol:ip=%{REMOTE_ADDR}_grc_pages,\
    tag:'grc-assessment'"

SecRule REQUEST_URI "@rx ^/grc-(?:tasks|risks)\.php" \
    "id:501079,phase:1,pass,nolog,\
    chain,\
    setvar:ip.grc_page_count=+1,\
    expirevar:ip.grc_page_count=60,\
    tag:'grc-assessment'"
SecRule REQUEST_METHOD "@streq POST" ""

# Rule 501080: Block if more than 30 POST requests per minute to tasks/risks
SecRule IP:GRC_PAGE_COUNT "@gt 30" \
    "id:501080,phase:1,deny,status:429,log,\
    msg:'GRC Pages: POST rate limit exceeded (>30 req/min from %{REMOTE_ADDR})',\
    tag:'grc-assessment',tag:'rate-limit',\
    chain"
SecRule REQUEST_METHOD "@streq POST" ""
