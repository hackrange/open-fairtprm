; =============================================================================
; Open TPRM - PHP Hardening Configuration
;
; This file ships with the application and is symlinked into PHP's conf.d:
;   ln -sf /data/open-tprm/config/php-hardening.ini /etc/php/<VERSION>/apache2/conf.d/99-hardening.ini
;
; When upgrading PHP versions, just create the symlink for the new version.
; The config lives here so it's version-controlled and doesn't need to be
; recreated or edited in /etc/php on every upgrade.
; =============================================================================

; --- Hide PHP from the world ---
expose_php = Off

; --- Error handling (never leak errors to users) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Disable dangerous functions ---
; proc_open is allowed -- the version upgrade feature uses it to run git
; with array argv (execve direct, no shell interpretation). All other shell
; execution functions remain disabled.
disable_functions = exec,passthru,shell_exec,system,popen,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_waitpid,pcntl_wexitstatus,pcntl_setpriority,pcntl_getpriority,pcntl_async_signals,show_source,highlight_file,phpinfo,dl

; --- Filesystem restrictions ---
; App directory, temp/session paths, and git binary paths (for version upgrade).
open_basedir = /data/open-tprm:/data/web:/tmp:/var/lib/php/sessions:/var/log/php:/usr/bin/git:/usr/lib/git-core:/usr/share/git-core

; --- Remote file inclusion prevention ---
allow_url_fopen = On
allow_url_include = Off

; --- Session hardening ---
session.name = __Host-APPSESSID
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_maxlifetime = 1800
session.cookie_lifetime = 0

; --- Upload limits ---
file_uploads = On
upload_max_filesize = 2G
post_max_size = 2G
max_file_uploads = 20

; --- Resource limits ---
max_execution_time = 300
max_input_time = 300
memory_limit = 2G
max_input_vars = 3000

; --- OPcache hardening ---
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.save_comments = 1
