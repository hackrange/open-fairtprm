<VirtualHost *:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	# Trust X-Real-IP from the upstream reverse proxy so
	# REMOTE_ADDR reflects the real visitor IP, not the gateway.
	RemoteIPHeader X-Real-IP
	RemoteIPInternalProxy 10.0.0.0/8
	RemoteIPInternalProxy 172.16.0.0/12
	RemoteIPInternalProxy 192.168.0.0/16
	RemoteIPInternalProxy 127.0.0.0/8

	<Directory /var/www/html>
		Options -Indexes -MultiViews +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Block direct access to sensitive application directories
	<Directory /var/www/html/config>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/includes>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/sql_updates>
		AllowOverride None
		Require all denied
	</Directory>
	<Directory /var/www/html/db_backup>
		AllowOverride None
		Require all denied
	</Directory>

	# Belt-and-suspenders: Location-based blocks for sensitive paths
	<LocationMatch "^/(config|includes|sql_updates|db_backup)/">
		Require all denied
	</LocationMatch>

	# Explicitly block dotfiles (.htaccess, .htpasswd, .env, etc.)
	<LocationMatch "/\.">
		Require all denied
	</LocationMatch>

	DirectoryIndex index.php index.html

	# Logging
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
