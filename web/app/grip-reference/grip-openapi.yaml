# Grip Security Public API — bundled reference for the FairTPRM Shadow SaaS
# integration. Generated from the tenant's live /public/openapi.json.
# Auth: access-token header. Served admin-only via reference-doc.php.
openapi: 3.1.0
info:
  title: Grip Security Public API
  version: '1.0'
  description: 'Reference for the Grip Security public API consumed by the FairTPRM

    Shadow SaaS integration. This document is a faithful mirror of the

    tenant''s own auto-generated specification, fetched live from

    https://<tenant>.dep.grip.security/public/openapi.json (FastAPI/OpenAPI

    3.1.0). The official documentation portal is at apidocs.grip.security.


    Authentication: send the tenant administrator API key in the

    `access-token` HTTP header on every request (security scheme

    `APIKeyHeader`). Bearer / X-API-Key / Basic are all rejected with 401.


    Pagination: list endpoints accept `offset` (zero-based) and `limit`.

    Iterate with offset until a page returns fewer rows than the limit.


    The FairTPRM integration normalizes each SaaS `url` to its registrable

    domain (e.g. https://www.united.com -> united.com) for vendor matching.'
  contact:
    name: Grip Security
    url: https://apidocs.grip.security/docs/api-docs/16b5e21308a0e-grip
servers:
- url: https://{tenant}.dep.grip.security/public
  description: Grip tenant base URL. The tenant prefix is the first part of the Grip Portal URL.
  variables:
    tenant:
      default: tenant
      description: Grip tenant prefix — the first part of your Grip Portal URL (replace with your tenant).
security:
- APIKeyHeader: []
tags:
- name: Users
  description: Grip Users Public API
- name: SaaS Application
  description: Grip SaaS Public API
- name: Workflows
  description: Grip Workflows Public API
- name: SaaS User
  description: Grip SaaS users Public API
- name: Posture Management
  description: Grip Posture Management Public API
- name: AuditLogs
  description: Grip Audit logs Public API
- name: Alerts V2
  description: Grip Alerts Public API
- name: AI Agents
  description: Grip AI Agents Public API
paths:
  /users:
    get:
      tags:
      - Users
      summary: List Users
      description: Retrieve a list of all the users in the organization, including organizational data
        and grip data. The list is paginated using Query Parameters.
      operationId: _users_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: For pagination purposes. Will set the maximum amount of users which will return
            from a single query. <br>`>= 1` `<= 500`
          default: 200
          title: Limit
        description: For pagination purposes. Will set the maximum amount of users which will return from
          a single query. <br>`>= 1` `<= 500`
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          description: For pagination purposes. Will get only users after this offset. If there are 200
            users in a page, the offset for page 2 will be 200. <br>`>= 0`
          default: 0
          title: Offset
        description: For pagination purposes. Will get only users after this offset. If there are 200
          users in a page, the offset for page 2 will be 200. <br>`>= 0`
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
                title: Response List Users Users Get
          headers:
            next:
              description: If there are more pages of results, will hold the link for the next page. If
                not set, it means there are no more pages for the query.
              example: https://CLIENT-PREFIX.dep.grip.security/public/users?offset=400&limit=200
              schema:
                type: integer
            prev:
              description: If there are previous pages of results, will hold the link for the previous
                page. If not set, it means there are no previous pages for the query.
              example: https://CLIENT-PREFIX.dep.grip.security/public/users?offset=200&limit=200
              schema:
                type: integer
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
